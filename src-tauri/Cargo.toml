[package]
name = "nexus-app"
version = "0.3.1"
description = "Desktop client for Nexus Tools"
authors = ["Nexus Corp"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

# Screen capture and OCR are Windows-only, matching the only target platform.
# `xcap` grabs the monitor pixels; `windows` exposes Windows.Media.Ocr, the OCR
# engine shipped with the OS — no Tesseract binary or training data to bundle.
[target."cfg(windows)".dependencies]
xcap = "0.9.7"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
