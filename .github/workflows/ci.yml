name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Vite 7 requires ^20.19.0 || >=22.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The NSIS and WiX toolchains are downloaded by the Tauri bundler on
      # first use; caching them saves a few minutes per run.
      - name: Cache Tauri bundler toolchains
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Must run before any cargo command: tauri-build resolves `frontendDist`
      # (../dist) at compile time and fails if it is missing.
      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows bundles
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
