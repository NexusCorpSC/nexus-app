name: Release

on:
  push:
    tags: ["v*"]

# Required to upload the installers to the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    name: Windows installers
    runs-on: windows-latest

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      # The tag drives the release, but the installer filenames come from
      # tauri.conf.json. A mismatch would publish `v0.2.0` containing
      # `Nexus App_0.1.0_x64-setup.exe`, so refuse to build instead.
      - name: Check tag matches declared versions
        run: |
          $expected = $env:TAG.TrimStart('v')

          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $match = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1
          $cargo = $match.Matches[0].Groups[1].Value

          Write-Host "tag=$env:TAG tauri.conf.json=$tauri package.json=$pkg Cargo.toml=$cargo"

          $mismatch = @()
          if ($tauri -ne $expected) { $mismatch += "tauri.conf.json ($tauri)" }
          if ($pkg -ne $expected) { $mismatch += "package.json ($pkg)" }
          if ($cargo -ne $expected) { $mismatch += "Cargo.toml ($cargo)" }

          if ($mismatch.Count -gt 0) {
            throw "Tag $env:TAG does not match: $($mismatch -join ', '). Align the versions before tagging."
          }

      # Without a public key the app cannot verify what it downloads, so the
      # updater would refuse the release this run is about to publish. Said
      # here rather than discovered by users after the fact.
      - name: Check the updater is configured
        run: |
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey

          if ([string]::IsNullOrWhiteSpace($pubkey)) {
            throw 'plugins.updater.pubkey is empty. Generate a key pair (see README) and store the private half in the repository secrets before releasing.'
          }

      # Checked here rather than next to the upload: a missing release then
      # costs a re-run instead of four minutes of compilation.
      - name: Check the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh` exiting non-zero is the answer being looked for, not a failure
          # to report, so read $LASTEXITCODE whichever way the shell is
          # configured to treat native commands.
          $exists = $false
          try {
            gh release view $env:TAG *> $null
            $exists = $LASTEXITCODE -eq 0
          } catch {
            $exists = $false
          }

          if (-not $exists) {
            throw "No release for $env:TAG. Create it (a draft is enough), then re-run this workflow."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache Tauri bundler toolchains
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # See ci.yml: anything that compiles the crate needs ../dist to exist.
      - name: Build frontend
        run: npm run build

      # `updater.conf.json` adds `createUpdaterArtifacts`, which is what makes
      # the bundler sign the installers. It is kept out of tauri.conf.json so
      # that CI — which has no signing key — still builds on every pull request.
      - name: Build Windows bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The path is resolved from the working directory, not from src-tauri.
        run: npm run tauri:build -- --config src-tauri/updater.conf.json

      # The release is written by hand — notes included — and this only hangs
      # the installers off it. Creating one here would either race that release
      # or publish a second, emptier one under the same tag.
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `-ErrorAction SilentlyContinue`: a bundle directory that does not
          # exist is exactly the case the check below reports, and letting
          # Get-ChildItem raise first would bury it.
          $files = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
            throw 'tauri build produced no installer.'
          }

          $files | ForEach-Object { Write-Host "attaching $($_.Name)" }

          # Splatted, not interpolated: passing the array inline would join the
          # paths into a single argument, and the installer names contain a
          # space ("Nexus App_0.1.0_x64-setup.exe").
          #
          # `--clobber` so re-running after a failed build replaces the assets
          # instead of stopping on the ones already uploaded.
          $ghArgs = @('release', 'upload', $env:TAG) +
            $files.FullName +
            @('--clobber')

          gh @ghArgs

      # What the running app reads to learn a newer version exists. Written
      # after the upload because it has to carry the URL GitHub actually gave
      # the installer — asset names are not the file names, spaces become dots.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File |
            Select-Object -First 1

          if (-not $setup) {
            throw 'no NSIS installer to advertise.'
          }

          # The bundler writes it next to the installer, and only when it has a
          # signing key. Its absence means the release would be un-installable
          # by the updater, which refuses anything it cannot verify.
          $signature = "$($setup.FullName).sig"
          if (-not (Test-Path $signature)) {
            throw "no signature next to $($setup.Name). Is TAURI_SIGNING_PRIVATE_KEY set in the repository secrets?"
          }

          $url = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" `
            --jq '.assets[] | select(.name | endswith("-setup.exe")) | .browser_download_url' |
            Select-Object -First 1

          if (-not $url) {
            throw 'the installer was not found among the release assets.'
          }

          # The release notes are written by hand; the update dialog shows them.
          $notes = gh release view $env:TAG --json body --jq .body

          $manifest = [ordered]@{
            version   = $env:TAG.TrimStart('v')
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signature -Raw).Trim()
                url       = $url
              }
            }
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Write-Host "advertising $url"

          gh release upload $env:TAG latest.json --clobber
