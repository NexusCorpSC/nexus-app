name: Microsoft Store

# The installer submitted to the Store is not the one attached to a GitHub
# release: it embeds the WebView2 runtime, which the Store requires and which
# the release installer downloads instead. Both are NSIS bundles written to
# `bundle/nsis/` under the same file name, so building them in one run would
# have the second silently overwrite the first — hence a workflow of its own,
# from a clean checkout.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # Nothing else builds this variant: without this trigger the overlay would
  # first be exercised by a tag, which is the worst moment to learn it is
  # wrong. Restricted to the two files that decide what it produces, so
  # ordinary pull requests keep to the single Windows build of ci.yml.
  pull_request:
    paths:
      - ".github/workflows/microsoft-store.yml"
      - "src-tauri/tauri.microsoftstore.conf.json"

permissions:
  contents: read

jobs:
  store:
    name: Store installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache Tauri bundler toolchains
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # See ci.yml: anything that compiles the crate needs ../dist to exist.
      - name: Build frontend
        run: npm run build

      # Two steps rather than one `tauri build`: the overlay configuration only
      # concerns the bundler, so the binary is compiled once without bundling
      # and the Store installer is then packed around it.
      #
      # No `updater.conf.json` here: the `.sig` files it produces are read from
      # the GitHub release by already-installed copies, and a Store submission
      # has no use for them.
      - name: Build the Store installer
        run: npm run tauri:build:store

      # The whole point of this variant is the embedded runtime, and a bundler
      # that fell back to the downloading bootstrapper would produce a perfectly
      # working installer that Partner Center rejects. Cheaper to notice here:
      # the offline installer carries ~130 MB of WebView2, the online one a few.
      - name: Check the WebView2 runtime is embedded
        run: |
          $setup = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File |
            Select-Object -First 1

          if (-not $setup) {
            throw 'tauri bundle produced no NSIS installer.'
          }

          # Compared in bytes, displayed in megabytes: rounding first would let
          # 59.96 MB through as "60.0".
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "$($setup.Name) — $mb MB"

          if ($setup.Length -lt 60MB) {
            throw "$($setup.Name) is only $mb MB: the WebView2 offline installer is missing. Check bundle.windows.webviewInstallMode in src-tauri/tauri.microsoftstore.conf.json."
          }

      # Uploaded rather than attached to the release: this installer is meant
      # for Partner Center only, and publishing it next to the release one —
      # same name, different contents — would be a way to hand users the wrong
      # file.
      - name: Upload the Store installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-microsoft-store
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
